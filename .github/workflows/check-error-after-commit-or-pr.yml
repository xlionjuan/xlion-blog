name: Check error after commit or PR

on:
    workflow_dispatch:
    pull_request:
      paths-ignore:
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore
    push:
      branches:
        - main
      paths-ignore:
        - ".github/**"
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore

jobs:
    check_error:
        name: "Check error"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                submodules: 'true'
                persist-credentials: false

            - name: Install Hugo
              uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
              with:
                hugo-version: 'latest'
                extended: true

            - name: Build
              run: |
                hugo
