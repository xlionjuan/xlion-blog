name: Check error after commit or PR

on:
    workflow_dispatch:
    pull_request:
      paths-ignore:
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore
    push:
      branches:
        - main
      paths-ignore:
        - ".github/**"
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore

jobs:
    check_error:
        name: "Check error"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                submodules: 'true'
                persist-credentials: false

            - name: Install Hugo
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
              with:
                hugo-version: 'latest'
                extended: true

            - name: Build
              run: |
                hugo
