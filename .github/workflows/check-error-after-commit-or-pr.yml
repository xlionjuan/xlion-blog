name: Check error after commit or PR

on:
    workflow_dispatch:
    pull_request:
      paths-ignore:
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore
    push:
      branches:
        - main
      paths-ignore:
        - ".github/**"
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore

jobs:
    check_error:
        name: "Check error"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                submodules: 'true'
                persist-credentials: false

            - name: Install Hugo
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
              with:
                hugo-version: 'latest'
                extended: true

            - name: Build
              run: |
                hugo
