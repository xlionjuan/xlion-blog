name: Check error after commit or PR

on:
    workflow_dispatch:
    pull_request:
      paths-ignore:
        - ".github/**"
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore
    push:
      branches:
        - main
      paths-ignore:
        - ".github/**"
        - ".frontmatter/**"
        - ".vscode/**"
        - "README.md"
        - .gitignore

jobs:
    check_error:
        name: "Check error"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2
              with:
                submodules: 'true'
                persist-credentials: false

            - name: Install Hugo
              uses: peaceiris/actions-hugo@v3.0.0
              with:
                hugo-version: 'latest'
                extended: true

            - name: Build
              run: |
                hugo
